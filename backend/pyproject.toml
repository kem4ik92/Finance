[project]
name = "manat-backend"
version = "0.1.0"
description = "Backend + Telegram bot for Manat finance tracker."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-telegram-bot>=21.6",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
